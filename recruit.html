<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채용 안내 | 세대이음 사회적협동조합</title>
<meta name="description" content="세대이음 사회적협동조합 채용 공고 — 세대를 잇는 돌봄·교육 현장에서 함께할 분을 찾습니다.">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFCF6; --bg-panel:#F5EEDF; --bg-panel-2:#FBF5E8;
    --ink:#2B2620; --ink-soft:#7A7166;
    --elder:#B8763A; --elder-soft:#E7CBA8;
    --youth:#3F7268; --youth-soft:#C7DCD5;
    --gold:#E3A83B; --navy:#33506E; --line:#E4D9C4;
    --radius-lg:28px; --radius-md:16px; --maxw:1120px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:'Noto Serif KR',serif; margin:0; font-weight:600; letter-spacing:-0.01em; }
  p{ margin:0; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 28px; }

  header{ position:sticky; top:0; z-index:50; background:rgba(255,252,246,0.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .nav{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; max-width:var(--maxw); margin:0 auto; }
  .logo{ display:flex; align-items:center; gap:10px; font-family:'Noto Serif KR',serif; font-weight:700; font-size:19px; }
  .logo img{ height:32px; width:auto; }
  .back{ font-size:14px; font-weight:500; color:var(--ink-soft); }
  .back:hover{ color:var(--elder); }

  .intro{ padding:72px 0 40px; }
  .eyebrow{ display:inline-block; font-size:14px; color:var(--elder); font-weight:700; margin-bottom:12px; }
  .intro h1{ font-size:clamp(28px,4vw,40px); line-height:1.3; margin-bottom:14px; }
  .intro p{ color:var(--ink-soft); font-size:16px; max-width:640px; }

  .filters{ display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 28px; }
  .chip{ border:1px solid var(--line); background:#fff; color:var(--ink); padding:7px 16px; border-radius:100px; font-size:14px; font-family:inherit; cursor:pointer; }
  .chip[aria-pressed="true"]{ background:var(--youth); border-color:var(--youth); color:#fff; }

  .list{ display:grid; gap:16px; padding-bottom:96px; }
  .job{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; }
  .job.closed{ opacity:.62; }
  .job summary{ list-style:none; cursor:pointer; padding:22px 24px; display:grid; gap:10px; }
  .job summary::-webkit-details-marker{ display:none; }
  .job-top{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .badge{ font-size:12px; font-weight:700; padding:3px 10px; border-radius:100px; }
  .b-open{ background:var(--youth-soft); color:var(--youth); }
  .b-closed{ background:#ECE6DA; color:var(--ink-soft); }
  .b-cat{ background:var(--bg-panel); color:var(--elder); }
  .b-pin{ background:var(--gold); color:#fff; }
  .dday{ margin-left:auto; font-size:13px; font-weight:700; color:var(--elder); }
  .job h2{ font-size:20px; line-height:1.4; }
  .meta{ display:flex; flex-wrap:wrap; gap:4px 18px; font-size:14px; color:var(--ink-soft); }
  .meta b{ color:var(--ink); font-weight:500; }
  .more{ font-size:13px; color:var(--youth); font-weight:700; }
  .job[open] .more::after{ content:" 접기"; }
  .job:not([open]) .more::after{ content:" 자세히 보기"; }

  .detail{ border-top:1px solid var(--line); padding:22px 24px 26px; background:var(--bg-panel-2); display:grid; gap:20px; }
  .detail h3{ font-size:15px; font-family:'Noto Sans KR',sans-serif; font-weight:700; color:var(--elder); margin-bottom:6px; }
  .detail ul{ margin:0; padding-left:20px; }
  .detail li{ margin:2px 0; }
  .summary-text{ white-space:pre-line; }
  .apply{ background:#fff; border-radius:12px; padding:18px 20px; border-left:4px solid var(--youth); }
  .apply-row{ display:flex; gap:12px; font-size:15px; }
  .apply-row span:first-child{ width:72px; flex:none; color:var(--ink-soft); }
  .apply-row a{ color:var(--youth); font-weight:500; text-decoration:underline; text-underline-offset:3px; }

  .empty{ text-align:center; padding:56px 20px; border:1.5px dashed var(--line); border-radius:var(--radius-md); color:var(--ink-soft); }
  .empty p + p{ margin-top:6px; font-size:14px; }

  footer{ border-top:1px solid var(--line); padding:32px 0 48px; font-size:14px; color:var(--ink-soft); }
  footer .wrap{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; }

  @media (max-width:640px){
    .wrap{ padding:0 16px; }
    .nav{ padding:14px 16px; }
    .logo{ font-size:16px; }
    .logo img{ height:26px; }
    .intro{ padding:48px 0 28px; }
    .job summary, .detail{ padding-left:18px; padding-right:18px; }
    .dday{ margin-left:0; width:100%; }
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="/"><img src="/assets/logo.png" alt="">세대이음 사회적협동조합</a>
    <a class="back" href="/">← 홈으로</a>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <span class="eyebrow">채용 안내</span>
    <h1>세대를 잇는 일에<br>함께할 분을 찾습니다</h1>
    <p>아이와 어르신, 지역을 잇는 돌봄·교육 현장에서 함께 성장할 동료를 기다립니다. 공고별 상세 내용을 확인하시고 안내된 방법으로 지원해 주세요.</p>
  </section>

  <div class="filters" id="filters" role="group" aria-label="분야별 보기"></div>
  <div class="list" id="list"><div class="empty"><p>채용 공고를 불러오는 중입니다…</p></div></div>
</main>

<footer>
  <div class="wrap">
    <span>ⓒ 2026 세대이음 사회적협동조합</span>
    <span>문의 010-5331-7401 · sdieum@naver.com</span>
  </div>
</footer>

<script>
(function(){
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = new Date(); today.setHours(0,0,0,0);
  const parseDate = d => /^\d{4}-\d{2}-\d{2}$/.test(d||'') ? new Date(d+'T00:00:00') : null;
  const fmt = d => { const x = parseDate(d); return x ? `${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,'0')}.${String(x.getDate()).padStart(2,'0')}` : (d||''); };

  function isClosed(j){
    if (j.status === 'closed') return true;
    const d = parseDate(j.deadline);
    return d ? d < today : false;
  }
  function dday(j){
    const d = parseDate(j.deadline);
    if (!d || isClosed(j)) return '';
    const n = Math.round((d - today)/86400000);
    return n === 0 ? '오늘 마감' : `D-${n}`;
  }
  const list = (title, arr) => Array.isArray(arr) && arr.length
    ? `<div><h3>${esc(title)}</h3><ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : '';

  function card(j){
    const closed = isClosed(j);
    const a = j.apply || {};
    const metaItems = [
      ['근무지', j.location], ['고용형태', j.employmentType], ['근무시간', j.workHours],
      ['급여', j.pay], ['모집인원', j.headcount], ['마감', j.deadline ? fmt(j.deadline) : '']
    ].filter(x => x[1]);
    const applyRows = [
      ['방법', a.method && esc(a.method)],
      ['이메일', a.email && `<a href="mailto:${esc(a.email)}">${esc(a.email)}</a>`],
      ['전화', a.phone && `<a href="tel:${esc(a.phone.replace(/[^0-9+]/g,''))}">${esc(a.phone)}</a>`],
      ['지원서', a.link && `<a href="${esc(a.link)}" target="_blank" rel="noopener">온라인 지원하기</a>`],
      ['제출서류', Array.isArray(a.documents) && a.documents.length && esc(a.documents.join(', '))]
    ].filter(x => x[1]);
    return `<details class="job${closed?' closed':''}" id="${esc(j.id)}">
      <summary>
        <div class="job-top">
          ${j.pinned && !closed ? '<span class="badge b-pin">중요</span>' : ''}
          <span class="badge ${closed?'b-closed':'b-open'}">${closed?'마감':'모집 중'}</span>
          ${j.category ? `<span class="badge b-cat">${esc(j.category)}</span>` : ''}
          <span class="dday">${dday(j)}</span>
        </div>
        <h2>${esc(j.title)}</h2>
        <div class="meta">${metaItems.map(([k,v])=>`<span>${k} <b>${esc(k==='마감'?v:v)}</b></span>`).join('')}</div>
        <span class="more"></span>
      </summary>
      <div class="detail">
        ${j.summary ? `<div><h3>소개</h3><p class="summary-text">${esc(j.summary)}</p></div>` : ''}
        ${list('담당 업무', j.duties)}
        ${list('자격 요건', j.requirements)}
        ${list('우대 사항', j.preferred)}
        ${list('근무 조건·복리후생', j.benefits)}
        ${applyRows.length ? `<div class="apply"><h3>지원 방법</h3>${applyRows.map(([k,v])=>`<div class="apply-row"><span>${k}</span><span>${v}</span></div>`).join('')}</div>` : ''}
        ${j.note ? `<p style="font-size:14px;color:var(--ink-soft)">※ ${esc(j.note)}</p>` : ''}
        ${j.posted ? `<p style="font-size:13px;color:var(--ink-soft)">게시일 ${esc(fmt(j.posted))}</p>` : ''}
      </div>
    </details>`;
  }

  function jsonLd(jobs){
    const items = jobs.filter(j => !isClosed(j)).map(j => ({
      "@context":"https://schema.org", "@type":"JobPosting",
      "title": j.title,
      "description": [j.summary, ...(j.duties||[]), ...(j.requirements||[])].filter(Boolean).join('\n'),
      "datePosted": j.posted, ...(parseDate(j.deadline) ? {"validThrough": j.deadline} : {}),
      "hiringOrganization": {"@type":"Organization","name":"세대이음 사회적협동조합","sameAs":"https://sdieum.com","logo":"https://sdieum.com/assets/logo.png"},
      "jobLocation": {"@type":"Place","address":{"@type":"PostalAddress","streetAddress": j.location || "백석로 86번길 38, B02","addressLocality":"고양시","addressRegion":"경기도","addressCountry":"KR"}}
    }));
    if (!items.length) return;
    const s = document.createElement('script'); s.type = 'application/ld+json';
    s.textContent = JSON.stringify(items.length === 1 ? items[0] : items);
    document.head.appendChild(s);
  }

  fetch('/data/jobs.json', {cache:'no-store'}).then(r => r.json()).then(data => {
    const jobs = (data.jobs || []).slice().sort((a,b) =>
      (isClosed(a) - isClosed(b)) || ((b.pinned?1:0) - (a.pinned?1:0)) || String(b.posted||'').localeCompare(String(a.posted||'')));
    const listEl = document.getElementById('list'), filEl = document.getElementById('filters');
    const cats = ['전체', ...new Set(jobs.map(j => j.category).filter(Boolean))];
    let current = '전체';
    function render(){
      const shown = jobs.filter(j => current === '전체' || j.category === current);
      listEl.innerHTML = shown.length ? shown.map(card).join('')
        : '<div class="empty"><p>현재 진행 중인 채용 공고가 없습니다.</p><p>상시 지원·문의는 sdieum@naver.com 으로 연락해 주세요.</p></div>';
      if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) { t.open = true; t.scrollIntoView({block:'start'}); } }
    }
    if (cats.length > 2) {
      filEl.innerHTML = cats.map(c => `<button class="chip" aria-pressed="${c===current}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
      filEl.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return;
        current = b.dataset.c; filEl.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); });
    }
    render(); jsonLd(jobs);
  }).catch(() => {
    document.getElementById('list').innerHTML = '<div class="empty"><p>채용 공고를 불러오지 못했습니다.</p><p>잠시 후 다시 시도하시거나 010-5331-7401 로 문의해 주세요.</p></div>';
  });
})();
</script>
</body>
</html>
